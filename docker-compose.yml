services:
  web:
    image: node:20-alpine
    container_name: own-web-front
    ports:
      - 5173:5173
      - "4173:4173"
    working_dir: /home/node/app
    volumes:
      - ./diegoweb/:/home/node/app
    command: >
      sh -c "npm run dev -- --host"
    environment:
      - CHOKIDAR_USEPOLLING=true
