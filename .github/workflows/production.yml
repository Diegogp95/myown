name: CD - Production

on:
  push:
    branches:
      - main

jobs:
  promote:
    name: Promote Staging -> Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PRODUCTION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PRODUCTION }}
          aws-region: ${{ secrets.AWS_REGION_PRODUCTION }}

      - name: Sync staging bucket to production
        run: aws s3 sync s3://${{ secrets.STAGING_BUCKET_NAME }} s3://${{ secrets.PRODUCTION_BUCKET_NAME }} --delete --exact-timestamps

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.PRODUCTION_CF_DISTRIBUTION_ID }} --paths "/*"
